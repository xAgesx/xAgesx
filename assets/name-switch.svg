<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B9FFF1"/><stop offset=".5" stop-color="#42E8C5"/><stop offset="1" stop-color="#66AFFF"/>
  </linearGradient>
  <filter id="blur" x="-40%" y="-100%" width="180%" height="300%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<rect width="700" height="120" fill="none"/>
<!-- Futuristic terminal / signal identity -->
<g font-family="monospace" text-anchor="middle">
  <g opacity="1">
    <text x="350" y="75" font-size="59" font-weight="700" letter-spacing="2" fill="none" stroke="#42E8C5" stroke-width="1.2" opacity=".35">THAMER</text>
    <text x="350" y="75" font-size="59" font-weight="700" letter-spacing="2" fill="url(#neon)">THAMER</text>
    <text x="350" y="98" font-size="11" letter-spacing="10" fill="#86A9B5">D O U S S</text>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.43;.48;.53;.96;1" dur="22s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="350" y="77" font-size="67" font-weight="700" letter-spacing="1" fill="none" stroke="#42E8C5" stroke-width="1.2" opacity=".35">xAgesx</text>
    <text x="350" y="77" font-size="67" font-weight="700" letter-spacing="1" fill="url(#neon)">xAgesx</text>
    <text x="350" y="98" font-size="10" letter-spacing="7" fill="#86A9B5">BUILD / PLAY / EXPLORE</text>
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.43;.48;.53;.96;1" dur="22s" repeatCount="indefinite"/>
  </g>
</g>
<!-- segmented signal brackets -->
<g fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="square">
  <path d="M115 38 V82 M115 38 H139 M115 82 H139"/>
  <path d="M585 38 V82 M585 38 H561 M585 82 H561"/>
  <path d="M128 60 H151 M572 60 H549" opacity=".5"/>
</g>
<g fill="#42E8C5">
  <circle cx="115" cy="60" r="3"><animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="585" cy="60" r="3"><animate attributeName="r" values="4;2;4" dur="2s" repeatCount="indefinite"/></circle>
</g>
<path d="M150 110 H550" stroke="#29424D" stroke-width="1"/>
<path d="M150 110 H550" stroke="url(#neon)" stroke-width="2" stroke-dasharray="28 372">
  <animate attributeName="stroke-dashoffset" values="400;0;-400" dur="4s" repeatCount="indefinite"/>
</path>
</svg>