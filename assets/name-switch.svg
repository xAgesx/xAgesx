<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F4F7FA"/>
    <stop offset=".55" stop-color="#B9D9E8"/>
    <stop offset="1" stop-color="#42E8C5"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#42E8C5"/><stop offset="1" stop-color="#7CCBFF"/>
  </linearGradient>
  <clipPath id="reveal"><rect x="0" y="0" width="700" height="120">
    <animate attributeName="width" values="0;700;700;0" keyTimes="0;.08;.88;1" dur="20s" repeatCount="indefinite"/>
  </rect></clipPath>
</defs>
<rect width="700" height="120" fill="none"/>
<!-- Name: clean editorial wordmark with a sharp signature slash -->
<g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800">
  <g opacity="1">
    <text x="350" y="70" font-size="53" letter-spacing="3.5" fill="url(#ink)">THAMER</text>
    <path d="M467 25 L450 78" stroke="url(#slash)" stroke-width="5" stroke-linecap="square"/>
    <text x="350" y="94" font-size="12" font-weight="600" letter-spacing="12" fill="#7E9BAA">DOUSS</text>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;0 -5;0 -5;0 0" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="350" y="76" font-size="66" letter-spacing="2" fill="url(#ink)">xAgesx</text>
    <path d="M490 29 L474 84" stroke="url(#slash)" stroke-width="5" stroke-linecap="square"/>
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 5;0 5;0 5;0 0;0 0;0 5" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
  </g>
</g>
<!-- Thin baseline; the traveling accent is deliberately restrained -->
<path d="M190 108 H510" stroke="#29424D" stroke-width="1"/>
<path d="M190 108 H510" stroke="url(#slash)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 278">
  <animate attributeName="stroke-dashoffset" values="320;0;-320" dur="5s" repeatCount="indefinite"/>
</path>
</svg>