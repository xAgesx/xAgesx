<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B9FFF1"/>
    <stop offset=".5" stop-color="#42E8C5"/>
    <stop offset="1" stop-color="#66AFFF"/>
  </linearGradient>
  <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="700" height="120" fill="none"/>
<g font-family="monospace" text-anchor="middle" filter="url(#softGlow)">
  <g>
    <text x="350" y="68" font-size="58" font-weight="700" letter-spacing="2" fill="none" stroke="#42E8C5" stroke-width="1.2" opacity=".35">THAMER</text>
    <text x="350" y="68" font-size="58" font-weight="700" letter-spacing="2" fill="url(#neon)">THAMER</text>
    <text x="350" y="99" font-size="19" font-weight="700" letter-spacing="8" fill="#86A9B5">DOUSS</text>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;0 -6;0 -6;0 0" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="350" y="79" font-size="68" font-weight="700" letter-spacing="1" fill="none" stroke="#42E8C5" stroke-width="1.2" opacity=".35">xAgesx</text>
    <text x="350" y="79" font-size="68" font-weight="700" letter-spacing="1" fill="url(#neon)">xAgesx</text>
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 6;0 0;0 0;0 6" keyTimes="0;.43;.47;.52;.96;1" dur="20s" repeatCount="indefinite"/>
  </g>
</g>
<path d="M150 110 H550" stroke="#29424D" stroke-width="1"/>
<path d="M150 110 H550" stroke="url(#neon)" stroke-width="2" stroke-dasharray="28 372">
  <animate attributeName="stroke-dashoffset" values="400;0;-400" dur="4s" repeatCount="indefinite"/>
</path>
</svg>